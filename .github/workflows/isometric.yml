name: Generate Isometric 3D Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: MuhammadHanzala-13
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: github-metrics-isocalendar.svg

      - name: Push generated file to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update isometric 3d calendar"
          file_pattern: github-metrics-isocalendar.svg
